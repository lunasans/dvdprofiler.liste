name: Docker Image

on:
  push:
    branches: [main]
    # Das Repo taggt Releases als shelf-vX.Y.Z, nicht als vX.Y.Z.
    tags: ['shelf-v*']
  # Woechentlich neu bauen und scannen. Veroeffentlicht wird dabei nichts -
  # der Lauf meldet neue Schwachstellen ins Security-Tab, behoben werden sie
  # mit dem naechsten Release.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'composer.lock'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'tessaa/movieshelf' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    env:
      # Der secrets-Kontext ist in if-Bedingungen nicht verfuegbar, deshalb
      # hier einmal auf eine Env-Variable abbilden.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Der Wochenlauf braucht die Tags, um das letzte Release zu finden.
          fetch-depth: 0

      # Der woechentliche Lauf baut nicht main, sondern das zuletzt
      # veroeffentlichte Release neu. So bekommt latest frische
      # Systempakete, bleibt aber eine bewusst getaggte Version.
      - name: Letztes Release ermitteln
        id: release
        if: github.event_name == 'schedule'
        run: |
          TAG=$(git tag -l 'shelf-v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "Kein shelf-v*-Tag vorhanden - nichts aufzufrischen"
            exit 1
          fi
          VERSION=${TAG#shelf-v}
          echo "Frische $TAG auf ($VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          git checkout --detach "$TAG"

      # arm64 ist Pflicht: ein grosser Teil der Selfhoster laeuft auf NAS,
      # Raspberry Pi oder Apple Silicon.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Bei Pull Requests nur bauen, nicht pushen.
      - name: GHCR-Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub ist optional: fehlen die Secrets, wird nur nach GHCR
      # gepusht statt den Build scheitern zu lassen (z.B. in Forks).
      - name: Docker-Hub-Login
        id: dockerhub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outcome == 'success' }}
          tags: |
            # Nur zur lokalen Benennung fuer Rauchtest und Scan - auf main
            # wird nichts gepusht. Beim Wochenlauf abgeschaltet, sonst
            # entstuende dort ein :main-Tag, der auch gepusht wuerde.
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            # Nur damit der Rauchtest unten einen Namen hat - wird nie gepusht.
            type=ref,event=pr
            # semver greift hier nicht, weil der Tag das Praefix shelf-v traegt.
            type=match,pattern=shelf-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=shelf-v(\d+\.\d+),group=1
            # Der Wochenlauf schreibt ausschliesslich latest neu. Die
            # Versions-Tags bleiben unveraendert: wer 2.42.0 festschreibt,
            # will einen definierten Stand und soll ihn nicht still
            # ausgetauscht bekommen.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          # QEMU-Emulation macht arm64 langsam, daher nur dort, wo
          # veroeffentlicht wird.
          platforms: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # Veroeffentlicht wird aus einem Tag heraus und beim Wochenlauf,
          # der dasselbe Release mit frischen Systempaketen ersetzt. Push
          # nach main und Pull Requests bauen und pruefen nur.
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # Ohne pull naehme der woechentliche Lauf das alte Basis-Image aus
          # dem Cache und saehe neue Sicherheitspatches nie.
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}

      # Ergebnisse landen im Security-Tab statt den Build rot zu faerben -
      # ein Teil der Alpine-CVEs hat schlicht noch keinen Patch.
      - name: Auf Schwachstellen pruefen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Beim Wochenlauf wird multi-arch gebaut und direkt gepusht, das
          # Image liegt dann nicht lokal vor - Trivy zieht es aus Docker Hub.
          image-ref: ${{ github.event_name == 'schedule' && format('{0}:latest', env.DOCKERHUB_IMAGE) || fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL

      - name: Ergebnisse hochladen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Die Beschreibung auf Docker Hub kommt aus der README, damit die
      # Repo-Seite dort nicht leer bleibt. Laeuft bei jedem Push nach main,
      # nicht nur bei Releases - sonst bleibt die Seite bis zum naechsten Tag
      # unveraendert, obwohl die README laengst weiter ist.
      # Rein kosmetisch - darf eine erfolgreiche Veroeffentlichung nicht
      # scheitern lassen. Das Docker-Hub-Token braucht fuer die Beschreibung
      # mehr Rechte als fuers Pushen; fehlen sie, antwortet die API mit 403.
      - name: Docker-Hub-Beschreibung aktualisieren
        if: steps.dockerhub.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "MovieShelf - dein digitales Filmregal, selfhosted"
          readme-filepath: ./README.md

      # Rauchtest: Container hochfahren und den Health-Endpoint abfragen.
      # Braucht ein lokal geladenes Image, entfaellt also dort, wo multi-arch
      # gebaut wird - bei Tags und beim Wochenlauf.
      - name: Container testen
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          if [ -z "$IMAGE" ]; then
            echo "Kein Image-Tag ermittelt - Rauchtest nicht moeglich"
            exit 1
          fi
          echo "Teste $IMAGE"
          docker run -d --name smoke -p 8080:8080 \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e APP_ENV=production -e APP_DEBUG=false \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up; then
              echo "Health-Check erfolgreich"
              exit 0
            fi
            sleep 5
          done
          echo "Container wurde nicht gesund:"
          docker logs smoke
          exit 1
